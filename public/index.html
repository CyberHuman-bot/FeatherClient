<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FeatherNet Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: monospace;
            background-color: #121212;
            color: #e0e0e0;
            padding: 6px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Bar */
        .bar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            position: sticky;
            top: 0;
            background: #121212;
            padding-bottom: 4px;
            z-index: 100;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px;
            background: #1e1e1e;
            color: #55ff55;
            border: 1px solid #333;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }
        button {
            padding: 8px 12px;
            background: #0066cc;
            color: #ffffff;
            border: none;
            font-family: monospace;
            font-weight: bold;
        }

        /* Viewport Canvas */
        #viewport {
            border: 1px solid #333;
            padding: 8px;
            background: #1a1a1a;
            flex: 1;
            overflow-y: auto;
            word-wrap: break-word;
        }

        #viewport img, #viewport video { max-width: 100%; height: auto; }
        #viewport a { 
            color: #4da6ff; 
            text-decoration: underline; 
            margin: 3px 0; 
            display: inline-block; 
            padding: 2px 4px;
        }
        #viewport audio { width: 100%; margin: 8px 0; background: #222; }

        .status {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        /* Highly Visible D-Pad Focus Ring */
        .focusable:focus, a:focus, input:focus, button:focus {
            outline: 2px solid #55ff55 !important;
            background-color: #223322 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <form action="/search" method="GET" class="bar" id="searchForm">
        <input type="text" name="q" id="urlInput" class="focusable" placeholder="URL or Search..." tabindex="1" required>
        <button type="submit" id="goBtn" class="focusable" tabindex="2">GO</button>
    </form>

    <div id="status" class="status">D-Pad Ready [F1/*: Search | F2/#: Back]</div>

    <!-- Main Content Canvas -->
    <div id="viewport">Enter a URL above to load via FeatherNet backend.</div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const viewport = document.getElementById('viewport');
        const statusEl = document.getElementById('status');
        const searchForm = document.getElementById('searchForm');

        let focusIndex = 0;
        let focusableElements = [];

        // Intercept form submission to load via AJAX without page reload
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = urlInput.value.trim();
            if (query) {
                fetchPage(query);
            }
        });

        function updateFocusables() {
            // Gather all interactive D-Pad elements
            focusableElements = Array.from(document.querySelectorAll('.focusable, a, button, input, audio'));
            focusableElements.forEach((el, idx) => {
                el.setAttribute('tabindex', idx + 1);
            });
        }

        function fetchPage(query) {
            statusEl.innerText = 'Status: Fetching via FeatherNet...';
            viewport.innerHTML = '<div style="color: #888;">Compressing page...</div>';

            fetch(`/search?q=${encodeURIComponent(query)}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.text();
                })
                .then(html => {
                    statusEl.innerText = `Loaded: ${query}`;
                    viewport.innerHTML = html;

                    // Intercept link clicks to keep routing through FeatherNet
                    const links = viewport.querySelectorAll('a');
                    links.forEach(a => {
                        a.classList.add('focusable');
                        a.addEventListener('click', (e) => {
                            e.preventDefault();
                            const href = a.getAttribute('href');
                            if (href) {
                                fetchPage(href);
                            }
                        });
                    });

                    updateFocusables();
                    focusIndex = 0;
                    if (focusableElements.length > 0) {
                        focusableElements[0].focus();
                    }
                })
                .catch(err => {
                    statusEl.innerText = 'Status: Connection Error';
                    viewport.innerHTML = `<div style="color: #ff5555;">Error: ${err.message}</div>`;
                });
        }

        // Hardware D-Pad and Nokia Keypad Event Handler
        window.addEventListener('keydown', (e) => {
            updateFocusables();

            switch(e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    if (focusIndex < focusableElements.length - 1) {
                        focusIndex++;
                        focusableElements[focusIndex].focus();
                        focusableElements[focusIndex].scrollIntoView({ block: 'nearest' });
                    } else {
                        viewport.scrollBy(0, 80);
                    }
                    break;

                case 'ArrowUp':
                    e.preventDefault();
                    if (focusIndex > 0) {
                        focusIndex--;
                        focusableElements[focusIndex].focus();
                        focusableElements[focusIndex].scrollIntoView({ block: 'nearest' });
                    } else {
                        viewport.scrollBy(0, -80);
                    }
                    break;

                // Dedicated Keypad Shortcuts
                case 'SoftLeft':
                case 'F1':
                case '*':
                    e.preventDefault();
                    urlInput.focus();
                    focusIndex = 0;
                    break;

                case 'SoftRight':
                case 'F2':
                case '#':
                    e.preventDefault();
                    window.history.back();
                    break;

                case 'Enter':
                    // Trigger click on currently focused D-Pad element
                    if (document.activeElement && document.activeElement !== urlInput) {
                        document.activeElement.click();
                    }
                    break;
            }
        });

        // Initialize focus list on load
        updateFocusables();
    </script>
</body>
</html>
