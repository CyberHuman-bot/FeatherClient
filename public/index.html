<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FeatherNet Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: monospace, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 4px;
            font-size: 13px;
            line-height: 1.3;
        }

        /* Top Bar */
        .bar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            background: #1e1e1e;
            padding: 4px;
            border-bottom: 1px solid #333;
        }
        input[type="text"] {
            flex: 1;
            padding: 6px;
            background: #121212;
            color: #55ff55;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 13px;
        }
        button {
            padding: 6px 10px;
            background: #0066cc;
            color: #ffffff;
            border: none;
            font-weight: bold;
            font-size: 12px;
        }

        /* Viewport Canvas (Native document flow, no scrollable div) */
        #viewport {
            word-wrap: break-word;
            padding: 2px;
        }

        #viewport img, #viewport video { max-width: 100%; height: auto; display: block; margin: 4px 0; }
        #viewport a { 
            color: #4da6ff; 
            text-decoration: underline; 
            display: inline-block; 
            margin: 2px 0;
            padding: 2px;
        }
        #viewport audio { width: 100%; margin: 6px 0; }

        .status {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 4px;
            background: #222;
            padding: 2px 4px;
        }

        /* High-contrast focus states for hardware D-Pad */
        :focus, .focusable:focus, a:focus, input:focus, button:focus {
            outline: 2px solid #55ff55 !important;
            background-color: #224422 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- Native HTTP Form Submission -->
    <form action="/search" method="GET" class="bar" id="searchForm">
        <input type="text" name="q" id="urlInput" class="focusable" placeholder="URL or Search..." tabindex="1" required>
        <button type="submit" id="goBtn" class="focusable" tabindex="2">GO</button>
    </form>

    <div id="status" class="status">[1/*: Focus Search | 2/#: Back | D-Pad: Navigate]</div>

    <!-- Main Content Stream -->
    <div id="viewport">
        <!-- FeatherNet server injects stripped HTML content here -->
    </div>

    <script>
        (function() {
            var urlInput = document.getElementById('urlInput');
            var statusEl = document.getElementById('status');
            var focusIndex = 0;
            var focusables = [];

            function refreshFocusables() {
                var elems = document.querySelectorAll('input, button, a, audio, .focusable');
                focusables = [];
                for (var i = 0; i < elems.length; i++) {
                    elems[i].setAttribute('tabindex', i + 1);
                    focusables.push(elems[i]);
                }
            }

            // Bind hardware keycode fallbacks for Mocor RTOS / Nokia D-Pad
            window.addEventListener('keydown', function(e) {
                refreshFocusables();

                var key = e.key || e.keyCode;

                // Dedicated Keypad Shortcuts (F1, '*', SoftLeft, key '1')
                if (key === 'F1' || key === '*' || key === 'SoftLeft' || key === 112 || key === 49) {
                    if (document.activeElement !== urlInput) {
                        e.preventDefault();
                        urlInput.focus();
                        urlInput.select();
                        focusIndex = 0;
                    }
                }

                // Back Shortcuts (F2, '#', SoftRight, key '2')
                if (key === 'F2' || key === '#' || key === 'SoftRight' || key === 113 || key === 50) {
                    e.preventDefault();
                    window.history.back();
                }

                // Up / Down D-Pad scroll fallback
                if (key === 'ArrowDown' || key === 40) {
                    if (focusIndex < focusables.length - 1) {
                        focusIndex++;
                        focusables[focusIndex].focus();
                    } else {
                        window.scrollBy(0, 50);
                    }
                }

                if (key === 'ArrowUp' || key === 38) {
                    if (focusIndex > 0) {
                        focusIndex--;
                        focusables[focusIndex].focus();
                    } else {
                        window.scrollBy(0, -50);
                    }
                }
            });

            refreshFocusables();
        })();
    </script>
</body>
</html>
